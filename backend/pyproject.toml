[project]
name = "passe-backend"
version = "1.0.0"
description = "API REST do mercado de jogadores da liga (estudo de caso SENAI/PE)."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "PTH", "ERA", "PL", "RUF", "DJ"]
ignore = ["PLR0913", "PLR2004", "DJ001", "DJ008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "config"]

[tool.ruff.lint.per-file-ignores]
"app/asgi.py" = ["E402"]
"config/settings_test.py" = ["F403"]
"tests/**" = ["PLR0917"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests"]
addopts = "-q"
